# Pushing a tag like v0.1.0 tests and builds on GitHub's Windows, Mac and Linux machines,
# then publishes a Release with what built. Only the Windows version has been tried for real.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install -q -r requirements-build.txt
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python packaging/build.py
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\GoProYTUploader -DestinationPath "GoProYTUploader-$env:GITHUB_REF_NAME-windows.zip"
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/GoProYTUploader.app "GoProYTUploader-$GITHUB_REF_NAME-mac.zip"
      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "GoProYTUploader-$GITHUB_REF_NAME-linux.tar.gz" -C dist GoProYTUploader
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: GoProYTUploader-*

  release:
    needs: build
    if: ${{ !cancelled() }}  # publish what built even if one system failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" GoProYTUploader-* --repo "$GITHUB_REPOSITORY" --generate-notes
