<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>GoPro → YouTube</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  color-scheme: light dark;  /* native controls (date picker icon) follow the theme */
  --bg: #f6f7f9; --panel: #fff; --line: #dfe3e8; --text: #1d2228; --muted: #6b7480;
  --accent: #d93025; --accent2: #1a73e8; --ok: #188038; --warn: #b06000; --sel: #e8f0fe;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181b; --panel: #1f2226; --line: #33383e; --text: #e6e8eb; --muted: #9aa2ab;
          --sel: #23324a; --accent2: #8ab4f8; --ok: #81c995; --warn: #fdd663; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.4 "Segoe UI", "Microsoft JhengHei UI", sans-serif; background: var(--bg); color: var(--text);
       display: grid; grid-template-rows: auto 1fr auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent2); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
label.f { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
label.f > * { font-size: 13px; color: var(--text); }

header { display: flex; gap: 10px; align-items: flex-end; padding: 10px 14px; background: var(--panel);
         border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header .folder { flex: 1 1 260px; min-width: 200px; }
header .folder input { width: 100%; }
.account { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.account .ch { color: var(--ok); font-weight: 600; }

/* left: the list; right: what you work on (big preview, prev/next, fields, map) */
main { display: grid; grid-template-columns: minmax(420px, 45fr) minmax(460px, 55fr); min-height: 0; }
.tablewrap { overflow: auto; min-height: 0; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--bg); font-weight: 600; font-size: 12px; color: var(--muted); z-index: 1; }
tr.row { cursor: pointer; }
tr.row:hover { background: color-mix(in srgb, var(--sel) 50%, transparent); }
tr.row.sel { background: var(--sel); }
tr.row.done td { color: var(--muted); }
td.title { width: 100%; }
td.title input { border-color: transparent; background: transparent; width: 100%; min-width: 160px; padding: 2px 4px; }
td.title .fn { display: block; padding-left: 5px; font: 11px Consolas, monospace; color: var(--muted); }
th.inc label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
td.title input:focus { border-color: var(--accent2); background: var(--panel); }
td.title input.locked { font-weight: 600; }
td.files { font-family: Consolas, monospace; font-size: 12px; }
td.place { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--muted); }
.tag.gps { color: var(--ok); border-color: var(--ok); }
.tag.nearby, .tag.manual { color: var(--warn); border-color: var(--warn); }
.tag.suspect { color: var(--accent); border-color: var(--accent); }
.hint.warn { color: var(--accent); }
.st { font-size: 12px; }
.st.uploaded { color: var(--ok); }
.st.error { color: var(--accent); }
.st.uploading, .st.merging { color: var(--accent2); }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 3px; width: 90px; }
.bar > div { height: 100%; background: var(--accent2); border-radius: 2px; }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }

aside { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: auto; background: var(--panel); }
/* preview and map side by side on top, so neither wastes the full width */
.media { display: grid; grid-template-columns: 1fr 1fr; height: 30vh; min-height: 220px; flex: none; border-bottom: 1px solid var(--line); }
#preview { background: #000; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#preview:empty { background: var(--bg); align-items: center; justify-content: center; }
#preview:empty::before { content: "選一段錄影，這裡會播放預覽"; color: var(--muted); }
#preview video { display: block; flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
#nav { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
#nav:empty { display: none; }
#nav .where { flex: 1; text-align: center; line-height: 1.3; }
#nav .where small { display: block; color: var(--muted); font: 11px Consolas, monospace; }
#nav .inc { display: flex; gap: 6px; align-items: center; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-weight: 600; }
#nav .inc.on { border-color: var(--ok); color: var(--ok); }
#map { height: 100%; min-width: 0; border-left: 1px solid var(--line); }
#preview .bar2 { display: flex; gap: 4px; align-items: center; padding: 4px 8px; background: var(--panel); flex-wrap: wrap; }
#preview .bar2 button { padding: 2px 8px; font-size: 12px; }
#preview .bar2 button.on { outline: 2px solid var(--accent2); }
.detail { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: none; }
.detail h3 { margin: 0; font-size: 13px; }
.grp { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
/* wide window: label and field on one line; narrow: stacked */
.grp label.f { display: grid; grid-template-columns: 7.5em 1fr; align-items: center; gap: 8px; font-size: 12px; }
@media (max-width: 1100px) { .grp label.f { display: flex; flex-direction: column; align-items: stretch; gap: 2px; } }
.grp .gh { display: flex; align-items: center; gap: 6px; }
.grp .gh b { font-size: 13px; }
.badge { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; }
button.mini { padding: 1px 8px; font-size: 12px; margin-left: auto; }
.grp.yt { border-color: var(--accent2); gap: 8px; }
.grp.yt > div:not(.gh):not(.ytlinks) { display: grid; grid-template-columns: 9em 1fr; }
.ytlinks { display: flex; gap: 8px; margin-top: 4px; }
a.btnlink { flex: 1; text-align: center; padding: 8px 10px; border-radius: 6px; text-decoration: none;
            border: 1px solid var(--accent2); color: var(--accent2); font-weight: 600; }
a.btnlink:first-child { background: var(--accent2); color: #fff; }
a.btnlink:hover { filter: brightness(1.1); }
.grp.yt .warn, .st.missing { color: var(--accent); }
.detail .row2 { display: flex; gap: 6px; }
.detail .row2 > * { flex: 1; }
.results { display: flex; flex-direction: column; gap: 2px; }
.results button { text-align: left; border: none; padding: 4px 6px; }
.results small { color: var(--muted); display: block; }
.hint { color: var(--muted); font-size: 12px; }
.desc { white-space: pre-wrap; max-height: 8em; overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; }

footer { background: var(--panel); border-top: 1px solid var(--line); }
#upbar { display: none; align-items: center; gap: 12px; padding: 10px 14px; flex-wrap: wrap;
         background: color-mix(in srgb, var(--accent2) 14%, var(--panel)); border-bottom: 1px solid var(--accent2); }
#upbar.on { display: flex; }
#upbar .t { font-weight: 600; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar.big { height: 8px; width: 260px; margin: 0; }
.title input.mismatch { outline: 2px solid var(--accent); }
.actions { display: flex; gap: 10px; align-items: center; padding: 8px 14px; flex-wrap: wrap; }
.actions .summary { color: var(--muted); }
.actions .spacer { flex: 1; }
#log { height: 110px; overflow: auto; font-family: Consolas, monospace; font-size: 12px; padding: 6px 14px;
       border-top: 1px solid var(--line); white-space: pre-wrap; color: var(--muted); }
#log .error { color: var(--accent); }
#log a { color: var(--accent2); }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); width: 520px; max-width: 92vw; padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
dialog .full { grid-column: 1 / -1; }
dialog h2 { margin: 0 0 12px; font-size: 16px; }
dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.check { display: flex; gap: 6px; align-items: center; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; place-items: center; z-index: 9999; }
.overlay.on { display: grid; }
.overlay div { background: var(--panel); padding: 16px 22px; border-radius: 10px; border: 1px solid var(--line); min-width: 280px; }
</style>
</head>
<body>
<header>
  <label class="f folder">影片資料夾
    <div style="display:flex;gap:6px">
      <input id="folder" placeholder="選擇 GoPro 影片所在的資料夾" readonly>
      <button id="btnPick">選擇…</button>
      <button id="btnScan" disabled>重新掃描</button>
    </div>
  </label>
  <label class="f">播放清單
    <input id="playlist" list="playlists" style="width:150px">
    <datalist id="playlists"></datalist>
  </label>
  <label class="f" title="每段錄影會從檔案自動判斷拍攝時的時區；判斷不出來時才用這個">預設時區
    <select id="trip_tz"></select>
  </label>
  <label class="f">標題格式
    <select id="title_format"></select>
  </label>
  <button id="btnSettings">設定</button>
  <div class="account">
    <span id="channel" class="hint">尚未登入 YouTube</span>
    <button id="btnSignIn">登入</button>
  </div>
</header>

<main>
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th class="inc" title="打勾的錄影，會在按「開始上傳」時上傳。點這裡可以全選 / 全部取消">
          <label><input type="checkbox" id="chkAll">上傳</label></th>
        <th>狀態</th><th>標題 / 原始檔</th><th>時間</th><th>長度</th><th>地點</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty">選擇資料夾後會列出影片。<br>GoPro 長片被切成的多個分段（GX01…、GX02…）會自動歸成同一段錄影。</div>
  </div>
  <aside>
    <div class="media"><div id="preview"></div><div id="map"></div></div>
    <div id="nav"></div>
    <div class="detail" id="detail">
      <div class="hint">點左邊的表格選一段錄影（Ctrl / Shift 可多選），就能在這裡看影片、修改。</div>
    </div>
  </aside>
</main>

<footer>
  <div id="upbar"></div>
  <div class="actions">
    <span class="summary" id="summary"></span>
    <span id="offset" class="hint"></span>
    <span class="spacer"></span>
    <button id="btnGeocode" disabled>查詢地名</button>
    <button id="btnCancel" disabled>停止</button>
    <button id="btnUpload" class="primary" disabled>開始上傳</button>
  </div>
  <div id="log"></div>
</footer>

<dialog id="dlgSettings">
  <h2>設定</h2>
  <div class="grid">
    <label class="f">相機時鐘時區
      <select id="camera_tz"></select>
    </label>
    <label class="f" title="在這個時區拍的影片，標題不加時區；其他時區會加上 JST 之類的縮寫">家鄉時區（標題不標示）
      <select id="home_tz"></select>
    </label>
    <label class="f">上傳時的瀏覽權限
      <select id="privacy">
        <option value="unlisted">非公開 (unlisted)</option>
        <option value="private">私人 (private)</option>
        <option value="public">公開 (public)</option>
      </select>
    </label>
    <label class="f full">說明欄範本（{files} = 原始檔名，{place} = 地點）
      <textarea id="description_template" rows="3"></textarea>
    </label>
    <label class="f">地名語言
      <select id="geocode_lang">
        <option value="zh-TW,ja">繁中優先，其次日文</option>
        <option value="ja">日文</option>
        <option value="en">English</option>
        <option value="zh-TW,en">繁中優先，其次英文</option>
      </select>
    </label>
    <div></div>
    <label class="check full"><input type="checkbox" id="merge_chapters"> 分段影片先無損合併成一支再上傳 <span id="ffmpegState" class="hint"></span></label>
    <label class="check full"><input type="checkbox" id="delete_merged"> 上傳成功後刪除合併出來的暫存檔（原始檔永遠不動）</label>
    <div class="full hint">類別固定為「旅遊與活動」，並自動設定：非為兒童打造、無付費宣傳、非 AI 合成內容。</div>
    <div class="full" style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="btnSecret">匯入 client_secret.json</button>
      <span id="secretState" class="hint" style="align-self:center"></span>
    </div>
    <div class="full" style="display:flex;gap:6px;flex-wrap:wrap">
      <button data-open="data">開啟資料夾</button>
      <button data-open="history">上傳紀錄 (CSV)</button>
      <button data-open="log">本次執行紀錄</button>
      <button id="btnSignOut">登出 YouTube</button>
    </div>
  </div>
  <div class="btns"><button id="btnCloseSettings">取消</button><button class="primary" id="btnSaveSettings">儲存</button></div>
</dialog>

<div class="overlay" id="busy"><div id="busyText">處理中…</div></div>

<script>
const TZS = ["Asia/Tokyo","Asia/Taipei","Asia/Seoul","Asia/Hong_Kong","Asia/Shanghai","Asia/Singapore",
  "Asia/Bangkok","Asia/Ho_Chi_Minh","Asia/Kuala_Lumpur","Asia/Manila","Asia/Dubai","Europe/London",
  "Europe/Paris","Europe/Berlin","Europe/Rome","America/New_York","America/Chicago","America/Denver",
  "America/Los_Angeles","Pacific/Honolulu","Australia/Sydney","Pacific/Auckland","UTC"];
const $ = s => document.querySelector(s);
let api, S = {}, items = [], selected = new Set(), lastClicked = null, uploading = false;
let map, layers = {};

const fmtSize = b => b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(0) + " MB";
const fmtDur = s => { s = Math.round(s); const m = Math.floor(s / 60); return m >= 60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}` : `${m}:${String(s%60).padStart(2,"0")}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATUS = { pending: "待上傳", uploading: "上傳中", merging: "合併中", uploaded: "已上傳", error: "失敗", partial: "部分完成",
  missing: "YouTube 上已刪除" };
const PRIVACY = { public: "公開", unlisted: "非公開", private: "私人" };
const LANG = { "zh-TW": "中文（台灣）", "zh-Hant": "中文（繁體）", ja: "日文", en: "英文" };
const TSRC = { gps: "GPS", "camera+gps_offset": "相機+GPS校正", camera: "相機時鐘", file_mtime: "檔案時間", manual: "手動" };
const LSRC = { gps: "GPS", nearby: "推測", manual: "手動" };
const ZSRC = { file: "從檔案自動判斷", manual: "手動指定", default: "判斷不出來，用預設時區" };

function log(msg, level) {
  const el = $("#log"), line = document.createElement("div");
  if (level === "error") line.className = "error";
  line.innerHTML = esc(new Date().toLocaleTimeString() + "  " + msg).replace(/(https:\/\/youtu\.be\/[\w-]+)/g, '<a href="$1" target="_blank">$1</a>');
  el.appendChild(line); el.scrollTop = el.scrollHeight;
}
function busy(text) { $("#busy").classList.toggle("on", !!text); if (text) $("#busyText").textContent = text; }
async function call(name, ...args) {
  try { return await api[name](...args); }
  catch (e) { log(`${name} 失敗：${e.message || e}`, "error"); busy(null); throw e; }
}

window.onEvent = ev => {
  if (ev.type === "log") log(ev.msg, ev.level);
  else if (ev.type === "channel") { setChannel(ev.name); log(`已登入 YouTube 頻道：${ev.name}`); }
  else if (ev.type === "scan") busy(`讀取中 ${ev.i} / ${ev.n}：${ev.name}`);
  else if (ev.type === "geocode") busy(`查詢地名 ${ev.i} / ${ev.n}：${ev.place}`);
  else if (ev.type === "item" || ev.type === "progress") {
    const it = items.find(x => x.id === ev.id); if (!it) return;
    const before = it.status;
    if (ev.status) it.status = ev.status;
    if (ev.video_ids) it.video_ids = ev.video_ids;
    if (ev.error) it.error = ev.error;
    if (ev.type === "progress") { it.status = "uploading"; it.progress = ev; }
    if (it.status !== before && ["uploaded", "error"].includes(it.status)) upDone++;
    updateStatusCell(it); updateUpbar(it);
    if (it.status !== before && selected.has(it.id)) renderDetail();  // lock / unlock its fields
  } else if (ev.type === "done") {
    uploading = false; log(ev.msg, ev.level); refreshButtons(); render();
    call("refresh_youtube").then(setPlan);  // show what YouTube kept (title, location…)
    $("#upbar").innerHTML = `<b>${esc(ev.msg)}</b>`;
    setTimeout(() => { if (!uploading) $("#upbar").classList.remove("on"); }, 8000);
  }
};

// big, obvious upload progress in the footer
let upTotal = 0, upDone = 0;
function updateUpbar(it) {
  const bar = $("#upbar"); bar.classList.add("on");
  const p = it.progress, pct = p && p.total ? 100 * p.done / p.total : 0;
  const what = it.status === "merging" ? "合併分段中…"
    : it.status === "uploading" ? `${pct.toFixed(0)}%（${fmtSize(p?.done || 0)} / ${fmtSize(p?.total || it.size)}）`
    : STATUS[it.status] || it.status;
  bar.innerHTML = `<b>上傳中 ${Math.min(upDone + 1, upTotal)} / ${upTotal}</b>
    <span class="t">${esc(it.title)}</span><span>${what}</span>
    <div class="bar big"><div style="width:${it.status === "uploading" ? pct : 0}%"></div></div>
    <span class="hint">上傳中可以繼續看預覽、修改還在排隊的錄影；不要關閉視窗。</span>`;
}

function setPlan(res) {
  items = res.items;
  for (const id of [...selected]) if (!items.find(i => i.id === id)) selected.delete(id);
  $("#offset").textContent = res.camera_offset_hours != null
    ? `相機時鐘比 UTC 快 ${res.camera_offset_hours} 小時（由 GPS 自動偵測）` : "";
  if (res.recent_places) S.recent_places = res.recent_places;
  // follow the selection, so a location just set is shown up close (not the whole trip)
  render(); drawMap(selected.size > 0); renderDetail();
}

function statusHtml(it) {
  let h = `<span class="st ${it.status}">${STATUS[it.status] || it.status}</span>`;
  if (it.status === "uploading" && it.progress) {
    const p = it.progress, pct = p.total ? (100 * p.done / p.total) : 0;
    h += `${p.parts > 1 ? ` ${p.part}/${p.parts}` : ""} ${pct.toFixed(0)}%<div class="bar"><div style="width:${pct}%"></div></div>`;
  }
  if (it.status === "uploaded" && it.video_ids?.length)
    h += " " + it.video_ids.map(v => `<a href="https://youtu.be/${v}" target="_blank">▶</a>`).join(" ");
  if (it.status === "error" && it.error) h += ` <span title="${esc(it.error)}">ⓘ</span>`;
  return h;
}
function updateStatusCell(it) {
  const td = document.querySelector(`tr[data-id="${CSS.escape(it.id)}"] td.status`);
  if (td) td.innerHTML = statusHtml(it); else render();
  summary();
}

function render() {
  const tb = $("#rows");
  $("#empty").style.display = items.length ? "none" : "";
  tb.innerHTML = items.map(it => `
    <tr class="row ${selected.has(it.id) ? "sel" : ""} ${it.status === "uploaded" ? "done" : ""}" data-id="${esc(it.id)}">
      <td><input type="checkbox" class="inc" ${it.include ? "checked" : ""} ${uploading ? "disabled" : ""}></td>
      <td class="status">${statusHtml(it)}</td>
      <td class="title">${(() => {
        const onYT = ["uploading", "merging", "uploaded", "partial"].includes(it.status);
        const warn = it.title_date_mismatch && !onYT;
        return `<input value="${esc(it.title)}" class="${it.title_locked ? "locked" : ""} ${warn ? "mismatch" : ""}"
          title="${onYT ? "已上傳或上傳中；要改請到 YouTube Studio" : warn ? `⚠ 標題裡的日期跟拍攝時間（${esc(it.local.slice(0, 10))}）不同` : it.title_locked ? "已手動修改；清空可恢復自動標題" : "自動產生，可直接修改"}"
          ${onYT ? "disabled" : ""}>`;
      })()}<span class="fn" title="${esc(it.folder)}">${esc(it.files.join(" + "))}${it.files.length > 1 ? `（${it.files.length} 段）` : ""}${it.scan_errors.length ? ` <span title="${esc(it.scan_errors.join("\n"))}">⚠</span>` : ""}</span></td>
      <td>${it.time_suspect ? '<span class="tag suspect" title="好幾段錄影的相機時間完全相同，相機時鐘可能跑掉了；預設不上傳，請在右側填入正確時間">⚠ 時間可疑</span>'
        : `<span class="tag ${it.time_source === "gps" ? "gps" : it.time_source === "manual" ? "manual" : ""}">${TSRC[it.time_source] || it.time_source}</span>`}</td>
      <td>${fmtDur(it.duration)}</td>
      <td class="place" title="${esc(it.place)}">${it.lat != null ? `<span class="tag ${it.loc_source}">${LSRC[it.loc_source] || ""}</span> ` : ""}${esc(it.place) || (it.lat != null ? `<span class="hint">${it.lat.toFixed(4)}, ${it.lon.toFixed(4)}</span>` : '<span class="hint">無</span>')}</td>
    </tr>`).join("");
  summary(); refreshButtons();
}

function summary() {
  const inc = items.filter(i => i.include && i.status !== "uploaded");
  const done = items.filter(i => i.status === "uploaded").length;
  $("#summary").textContent = items.length
    ? `${items.length} 段錄影 · 已上傳 ${done} · 本次要傳 ${inc.length} 段（${fmtSize(inc.reduce((a, i) => a + i.size, 0))}）` : "";
  $("#chkAll").checked = items.length && items.every(i => i.include);
}
function refreshButtons() {
  const has = items.length > 0;
  $("#btnScan").disabled = !S.last_folder || uploading;
  $("#btnPick").disabled = uploading;
  $("#btnGeocode").disabled = !has || uploading || !items.some(i => i.lat != null && !i.place);
  const todo = items.filter(i => i.include && i.status !== "uploaded").length;
  $("#btnUpload").disabled = !has || uploading || !todo;
  $("#btnUpload").textContent = todo ? `開始上傳（${todo} 段）` : "開始上傳";
  $("#btnUpload").title = todo ? "上傳表格中「上傳」欄打勾的錄影" : "先在表格的「上傳」欄，或右側的「要上傳」打勾";
  $("#btnCancel").disabled = !uploading;
}

// ---------------------------------------------------------------- table events
$("#rows").addEventListener("click", e => {
  const tr = e.target.closest("tr.row"); if (!tr || e.target.matches("input, a")) return;
  const id = tr.dataset.id, ids = items.map(i => i.id);
  if (e.shiftKey && lastClicked) {
    const [a, b] = [ids.indexOf(lastClicked), ids.indexOf(id)].sort((x, y) => x - y);
    if (!e.ctrlKey) selected.clear();
    ids.slice(a, b + 1).forEach(x => selected.add(x));
  } else if (e.ctrlKey) { selected.has(id) ? selected.delete(id) : selected.add(id); lastClicked = id; }
  else { selected = new Set([id]); lastClicked = id; }
  document.querySelectorAll("tr.row").forEach(r => r.classList.toggle("sel", selected.has(r.dataset.id)));
  drawMap(true); renderDetail();
});
$("#rows").addEventListener("change", async e => {
  const tr = e.target.closest("tr.row"); if (!tr) return;
  const id = tr.dataset.id;
  if (e.target.classList.contains("inc")) setPlan(await call("edit", [id], { include: e.target.checked }));
  else if (e.target.closest("td.title")) setPlan(await call("edit", [id], { title: e.target.value.trim() || null }));
});
$("#chkAll").addEventListener("change", async e => {
  setPlan(await call("edit", items.filter(i => i.status !== "uploaded" || !e.target.checked).map(i => i.id), { include: e.target.checked }));
});

// ------------------------------------------------------------------------- map
function initMap() {
  map = L.map("map", { zoomControl: true }).setView([35.68, 139.76], 5);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  new ResizeObserver(() => map.invalidateSize()).observe($("#map"));  // window / panel resizes
}
function drawMap(fitSelection) {
  Object.values(layers).forEach(l => map.removeLayer(l)); layers = {};
  const pts = [];
  for (const it of items) {
    if (it.lat == null) continue;
    const sel = selected.has(it.id);
    const g = L.layerGroup();
    if (it.track.length > 1) L.polyline(it.track, { color: sel ? "#d93025" : "#1a73e8", weight: sel ? 4 : 2, opacity: sel ? .9 : .45 }).addTo(g);
    L.circleMarker([it.lat, it.lon], { radius: sel ? 8 : 5, color: "#fff", weight: 1.5,
      fillColor: sel ? "#d93025" : (it.loc_source === "gps" ? "#1a73e8" : "#e8a33d"), fillOpacity: 1 })
      .bindTooltip(`${esc(it.title)}<br>${esc(it.place || "")}`).on("click", () => selectItem(it.id)).addTo(g);
    g.addTo(map); layers[it.id] = g;
    if (!fitSelection || sel) pts.push([it.lat, it.lon], ...it.track);
  }
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 16 });
}

// ---------------------------------------------------------------------- detail
// --------------------------------------------------------------------- preview
let previewId = null;
async function renderPreview() {
  const id = selected.size === 1 ? [...selected][0] : null;
  if (id === previewId) return;
  previewId = id;
  const box = $("#preview");
  box.querySelector("video")?.pause();
  box.innerHTML = "";
  setTimeout(() => map.invalidateSize(), 0);  // the map's box changes with the player
  if (!id) return;
  const srcs = await call("preview_sources", id);
  if (previewId !== id || !srcs.length) return;  // selection moved on while loading
  const show = n => {
    const s = srcs[n];
    box.innerHTML = `<video controls preload="metadata" src="${esc(s.url)}"></video>
      <div class="bar2">
        ${srcs.length > 1 ? srcs.map((x, i) => `<button data-n="${i}" class="${i === n ? "on" : ""}">${i + 1}/${srcs.length}</button>`).join("") : ""}
        <span class="hint">${esc(s.name)} · ${s.lrv ? "低解析度預覽（LRV）" : "原檔，若無法播放代表格式不支援（例如 HEVC）"}</span>
      </div>`;
    box.querySelector("video").onloadedmetadata = () => map.invalidateSize();
    box.querySelector("video").onerror = () => {
      box.querySelector(".hint").textContent = `${s.name} · 無法播放這個檔案（可能是 HEVC 格式且沒有 LRV 預覽檔）`;
    };
    box.querySelectorAll("button[data-n]").forEach(b => b.onclick = () => show(+b.dataset.n));
  };
  show(0);
}

// -------------------------------------------------------- prev / next + tick
function selectItem(id) {
  selected = new Set([id]); lastClicked = id;
  document.querySelectorAll("tr.row").forEach(r => r.classList.toggle("sel", r.dataset.id === id));
  document.querySelector(`tr[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
  drawMap(true); renderDetail();
}
function step(delta) {
  if (!items.length) return;
  const i = items.findIndex(x => selected.has(x.id));
  const j = i < 0 ? 0 : Math.min(Math.max(i + delta, 0), items.length - 1);
  selectItem(items[j].id);
}
function renderNav() {
  const nav = $("#nav"), sel = items.filter(i => selected.has(i.id));
  if (sel.length !== 1) {
    nav.innerHTML = sel.length ? `<span class="where">已選 ${sel.length} 段錄影，下面的修改會套用到全部</span>` : "";
    return;
  }
  const it = sel[0], i = items.indexOf(it), onYT = ["uploading", "merging", "uploaded", "partial"].includes(it.status);
  nav.innerHTML = `
    <button id="navPrev" ${i === 0 ? "disabled" : ""} title="鍵盤 ↑">◀ 上一支</button>
    <span class="where">第 ${i + 1} / ${items.length} 段 · ${fmtDur(it.duration)} · ${fmtSize(it.size)}
      <small>${esc(it.files.join(" + "))}</small></span>
    ${onYT ? `<span class="inc on">✓ ${STATUS[it.status]}</span>`
      : `<label class="inc ${it.include ? "on" : ""}" title="打勾的錄影，會在按「開始上傳」時上傳">
           <input type="checkbox" id="navInc" ${it.include ? "checked" : ""} ${uploading ? "disabled" : ""}>要上傳</label>`}
    <button id="navNext" ${i === items.length - 1 ? "disabled" : ""} title="鍵盤 ↓">下一支 ▶</button>`;
  $("#navPrev").onclick = () => step(-1);
  $("#navNext").onclick = () => step(1);
  const inc = $("#navInc");
  if (inc) inc.onchange = async () => setPlan(await call("edit", [it.id], { include: inc.checked }));
}
// ↑ / ↓ move through the list, unless you are typing or using the video player
document.addEventListener("keydown", e => {
  if (!["ArrowUp", "ArrowDown"].includes(e.key) || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.target.closest("input, select, textarea, video, dialog")) return;
  e.preventDefault(); step(e.key === "ArrowUp" ? -1 : 1);
});

function renderDetail() {
  renderPreview(); renderNav();
  const d = $("#detail"), sel = items.filter(i => selected.has(i.id));
  if (!sel.length) { d.innerHTML = '<div class="hint">點表格選一段或多段錄影（Ctrl / Shift 可多選），就能在這裡修改。</div>'; return; }
  const one = sel.length === 1 ? sel[0] : null, ids = [...selected];
  const locked = sel.some(i => ["uploading", "merging", "uploaded", "partial"].includes(i.status));
  if (one && locked) {  // already on YouTube: show YouTube's data instead of fields that can't change
    const busyNow = ["uploading", "merging"].includes(one.status);
    d.innerHTML = `${busyNow ? '<div class="hint">正在上傳，完成後這裡會顯示 YouTube 上的資料。</div>'
        : one.yt ? ytBox(one)
        : `<div class="hint">已上傳。登入 YouTube 後重新掃描，這裡會顯示 YouTube 上目前的資料。</div>
           ${(one.video_ids || []).map(v => `<div class="ytlinks"><a class="btnlink" href="https://youtu.be/${esc(v)}" target="_blank">▶ 打開影片</a>
             <a class="btnlink" href="https://studio.youtube.com/video/${esc(v)}/edit" target="_blank">✎ 在 YouTube Studio 修改</a></div>`).join("")}`}`;
    return;
  }
  // which groups of fields the user has changed (on any of the selected recordings)
  const GROUPS = { title: ["title"], time: ["local_time", "tz"], place: ["place", "lat", "lon"] };
  const edited = g => sel.some(i => i.edited.some(k => GROUPS[g].includes(k)));
  const head = (g, label) => `<div class="gh"><b>${label}</b>
    ${edited(g) ? `<span class="badge">已修改</span><button class="mini" data-reset="${g}" title="還原成自動判斷的值">還原</button>` : ""}</div>`;
  d.innerHTML = `
    ${locked ? `<div class="hint warn">${one ? "這段錄影" : "已選的錄影中有些"}${one?.status === "uploading" || one?.status === "merging" ? "正在上傳" : "已經上傳到 YouTube"}，這裡的修改不會影響 YouTube 上的影片，所以先鎖住了。要改請到 YouTube Studio。</div>` : ""}
    ${one?.status === "missing" ? '<div class="hint warn">這支影片之前上傳過，但在 YouTube 上已經刪除了。可以修改後重新勾選上傳。</div>' : ""}
    ${one?.time_suspect ? '<div class="hint warn">⚠ 好幾段錄影的相機時間完全相同，相機時鐘可能跑掉了。看完預覽後請填入正確的拍攝時間。</div>' : ""}
    ${locked ? "" : '<div class="hint">改完按 Enter 或點別的地方就會自動儲存。</div>'}
    ${one ? `<section class="grp">${head("title", "標題")}
      <input id="titleInput" value="${esc(one.title)}">
      ${one.title_date_mismatch ? `<div class="hint warn">⚠ 標題裡的日期跟拍攝時間（${esc(one.local.slice(0, 10))}）不同。
        <button class="mini" id="btnFixDate">只把標題開頭的日期改成 ${esc(one.local.slice(0, 10))}</button></div>` : ""}
    </section>` : ""}
    <section class="grp">${head("time", "拍攝時間")}
      ${one ? `<label class="f"><span>日期時間 <span class="hint">${TSRC[one.time_source] || one.time_source}</span></span>
        <input id="timeInput" type="datetime-local" value="${esc(one.local.slice(0, 16).replace(" ", "T"))}">
      </label>` : ""}
      <label class="f"><span>時區${one ? ` <span class="hint">${one.tz_source === "file" ? "自動" : one.tz_source === "manual" ? "手動" : "預設"}</span>` : ""}</span>
        <select id="tzInput">
          <option value="">自動${one && one.tz_source !== "manual" ? `（目前：${esc(one.tz)}）` : "（從檔案判斷）"}</option>
          ${TZS.map(t => `<option value="${t}" ${one && one.tz_source === "manual" && one.tz === t ? "selected" : ""}>${t}${t === S.home_tz ? "（家鄉，標題不標示）" : ""}</option>`).join("")}
        </select>
      </label>
    </section>
    <section class="grp">${head("place", "拍攝地點（上傳到 YouTube 的地點資訊）")}
      <label class="f"><span>地點名稱</span>
        <input id="placeInput" value="${one ? esc(one.place) : ""}" placeholder="${one ? "例如：範例車站" : "輸入後套用到全部已選的錄影"}">
      </label>
      <div class="hint">座標：${one?.lat != null ? `${one.lat.toFixed(5)}, ${one.lon.toFixed(5)}（${LSRC[one.loc_source] || ""}）` : sel.length > 1 ? "—" : "沒有"}</div>
      <label class="f"><span title="會同時設定名稱和座標">搜尋地點</span>
        <div style="display:flex;gap:6px"><input id="searchQ" placeholder="例如：地標、車站名稱（會同時設定名稱和座標）" style="flex:1"><button id="btnSearch">搜尋</button></div>
      </label>
      <div class="results" id="results"></div>
      ${(S.recent_places || []).length ? `<div class="f"><span class="hint">最近用過的地點（點一下套用）</span>
        <div class="chips">${S.recent_places.map((p, i) => `<button class="chip" data-recent="${i}" title="${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}">${esc(p.place)}</button>`).join("")}</div>
      </div>` : ""}
    </section>
    ${sel.some(i => i.edited.length) ? `<button id="btnResetAll">還原${one ? "這段" : "已選錄影"}的所有修改</button>` : ""}`;

  if (locked) {  // several selected, some already on YouTube
    d.querySelectorAll("section input, section select, section button, #btnResetAll").forEach(el => el.disabled = true);
    return;
  }
  const save = async fields => setPlan(await call("edit", ids, fields));
  const onCommit = (el, fn) => {  // Enter or leaving the field saves; Esc puts the old value back
    if (!el) return;
    const orig = el.value;
    el.onkeydown = e => {
      if (e.key === "Enter" && !e.isComposing) el.blur();
      if (e.key === "Escape") { el.value = orig; el.blur(); }
    };
    el.onblur = () => { if (el.value !== orig) fn(el.value.trim()); };
  };
  onCommit($("#titleInput"), v => save({ title: v || null }));
  const fix = $("#btnFixDate");
  if (fix) fix.onclick = async () => setPlan(await call("fix_title_dates", ids));
  onCommit($("#timeInput"), v => v && save({ local_time: v }));
  onCommit($("#placeInput"), v => save({ place: v || null }));
  $("#tzInput").onchange = e => save({ tz: e.target.value || null });
  d.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
    const g = b.dataset.reset;
    if (g === "title" && !confirm(`會刪掉你打的標題，恢復成程式自動產生的標題${one ? `（例如「${one.local.slice(0, 16)}」）` : ""}。確定嗎？`)) return;
    save(Object.fromEntries(GROUPS[g].map(k => [k, null])));
  });
  const all = $("#btnResetAll");
  if (all) all.onclick = async () => {
    if (confirm(`要還原${one ? "這段錄影" : ` ${sel.length} 段錄影`}的標題、時間、時區、地點，全部回到自動判斷的值嗎？`))
      setPlan(await call("reset_edits", ids));
  };
  d.querySelectorAll("[data-recent]").forEach(b => b.onclick = () => {
    const p = S.recent_places[+b.dataset.recent]; applyLocation(p.lat, p.lon, p.place);
  });
  const doSearch = async () => {
    const q = $("#searchQ").value.trim(); if (!q) return;
    $("#results").innerHTML = '<span class="hint">搜尋中…</span>';
    const c = map.getCenter();
    const rs = await call("search_place", q, c.lat, c.lng);
    $("#results").innerHTML = rs.length ? rs.map((r, i) => `<button data-i="${i}">${esc(r.place)}<small>${esc(r.full)}</small></button>`).join("") : '<span class="hint">找不到</span>';
    $("#results").querySelectorAll("button").forEach(b => b.onclick = () => {
      const r = rs[+b.dataset.i]; applyLocation(r.lat, r.lon, r.place);
    });
  };
  $("#btnSearch").onclick = doSearch;
  $("#searchQ").onkeydown = e => { if (e.key === "Enter") doSearch(); };
}
function ytBox(it) {
  const row = (k, v) => `<div><span class="hint">${k}</span><span>${v}</span></div>`;
  return it.yt.map((y, n) => `<section class="grp yt"><div class="gh"><b>YouTube 上目前的資料${it.yt.length > 1 ? `（第 ${n + 1} 段）` : ""}</b></div>
    ${y.missing ? '<div class="hint warn">YouTube 上找不到這支影片（可能已刪除）。可以重新勾選上傳。</div>' : `
      ${row("標題", esc(y.title))}
      ${row("說明", y.description ? `<span class="desc">${esc(y.description)}</span>` : '<span class="hint">（空白）</span>')}
      ${row("瀏覽權限", PRIVACY[y.privacy] || esc(y.privacy || "—"))}
      ${row("拍攝日期", esc(y.recording_date || "—"))}
      ${row("地點", y.lat != null ? `${esc(y.place || "（沒有名稱）")} <span class="hint">${y.lat.toFixed(5)}, ${y.lon.toFixed(5)}</span>` : '<span class="warn">沒有</span>')}
      ${row("標題和說明的語言", LANG[y.title_language] || esc(y.title_language || "—"))}
      ${row("影片語言", LANG[y.audio_language] || esc(y.audio_language || "—"))}
      <div class="ytlinks">
        <a class="btnlink" href="https://youtu.be/${esc(y.id)}" target="_blank">▶ 打開影片</a>
        <a class="btnlink" href="https://studio.youtube.com/video/${esc(y.id)}/edit" target="_blank">✎ 在 YouTube Studio 修改</a>
      </div>`}
  </section>`).join("");
}
async function applyLocation(lat, lon, place) {
  setPlan(await call("edit", [...selected], { lat, lon, place }));
}

$("#btnSettings").onclick = openSettings;
$("#btnCloseSettings").onclick = () => $("#dlgSettings").close();
$("#btnSaveSettings").onclick = async () => {
  await saveSettings({ camera_tz: $("#camera_tz").value, home_tz: $("#home_tz").value, privacy: $("#privacy").value,
    description_template: $("#description_template").value || "{files}", geocode_lang: $("#geocode_lang").value,
    merge_chapters: $("#merge_chapters").checked, delete_merged: $("#delete_merged").checked });
  $("#dlgSettings").close();
};
$("#btnSecret").onclick = async () => { if (await call("pick_client_secret")) { INIT.has_secret = true; $("#secretState").textContent = "✓ 已設定"; } };
$("#btnSignOut").onclick = async () => { await call("sign_out"); setChannel(null); };
document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => call("open_path", b.dataset.open));

// ----------------------------------------------------------------------- boot
let INIT;
window.addEventListener("pywebviewready", async () => {
  api = window.pywebview.api;
  fillSelect($("#trip_tz"), TZS);
  fillSelect($("#home_tz"), TZS);
  fillSelect($("#camera_tz"), ["auto", ...TZS], ["自動（用 GPS 時間校正）", ...TZS.map(t => `相機設定為 ${t}`)]);
  INIT = await call("init");
  S = INIT.settings;
  fillSelect($("#title_format"), Object.keys(INIT.title_formats), Object.values(INIT.title_formats));
  loadSettingsUI(); setChannel(INIT.channel); initMap(); refreshButtons();
  if (INIT.login_expired) { $("#channel").textContent = "⚠ 登入已過期，請重新登入"; $("#channel").className = "hint warn"; }
  log(`資料與紀錄存放在 ${INIT.app_dir}`);
  if (!INIT.has_secret) log("第一次使用：請先在「設定」匯入 client_secret.json，再按「登入」。");
});
</script>
</body>
</html>
